[package]
name = "documents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Documents, a live document editor built on Typst, as a Waft app in WinUI's Fluent look over wasdk-adapter-waft: Typst's markup on one side, its typeset pages on the other, compiled in the program as it is typed. `waos run -p documents`."

[dependencies]
waft.workspace = true
wasdk-adapter-waft.workspace = true
# How a gesture detector is hit, which `GestureDetector::behavior` takes and `waft` does not
# re-export.
waft-rendering.workspace = true
# The keys the menu's and the window's shortcuts name.
waft-services.workspace = true
waft-winui.workspace = true
wasdk.workspace = true
# The typesetting system: the compiler, which reads the markup through a `World` the app gives it;
# the pages it lays out; what draws a page as pixels; and what writes the pages as a PDF. Its
# fonts are files in `fonts/`, not `typst-assets`' `fonts` feature, which bundles a face under
# the GPL among them.
typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-pdf = "0.15.1"
# What the window and the typesetting worker send each other: serde for the messages' shape,
# postcard for their bytes, `serde_bytes` for a page's pixels as one run of bytes.
serde.workspace = true
postcard.workspace = true
serde_bytes.workspace = true
# The queue of the window's requests to the worker, and the two loops of its link to it.
futures.workspace = true

[dev-dependencies]
# Folders made for the tests of saving, removed after them.
tempfile.workspace = true
# The parser Typst reads fonts with, which the tests take a carried face's tables apart with, as
# the platform serves a system face's; the version Typst's own `typst-library` uses.
ttf-parser = "0.25.1"


[lints]
workspace = true

# What WaOS knows the program by. The id names it for good: every update is published under it.
[package.metadata.waos]
id = "dev.waos.documents"
name = "Documents"
icon = "icon.png"
