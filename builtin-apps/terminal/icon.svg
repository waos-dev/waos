<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Terminal: a slab of dark glass with a shell's coloured output and a lit block cursor. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55575e"/><stop offset="1" stop-color="#232428"/></linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1d21"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/><stop offset="0.2" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="20"/><feOffset dy="20"/><feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <rect x="160" y="208" width="704" height="608" rx="84" fill="url(#slab)" filter="url(#shadow)"/>
  <rect x="160" y="208" width="704" height="608" rx="84" fill="url(#sheen)"/>
  <rect x="161.500" y="209.500" width="701" height="605" rx="82.500" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <g stroke-linecap="round" stroke-width="40">
    <path d="M250 318 H310" stroke="#30d158"/><path d="M360 318 H580" stroke="#a1a5ae"/>
    <path d="M250 406 H440" stroke="#64d2ff"/><path d="M490 406 H560" stroke="#a1a5ae" stroke-opacity="0.7"/><path d="M610 406 H720" stroke="#a1a5ae" stroke-opacity="0.7"/>
    <path d="M250 494 H520" stroke="#a1a5ae" stroke-opacity="0.45"/>
  </g>
  <path d="M254 612 L326 660 L254 708" fill="none" stroke="#30d158" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="372" y="608" width="64" height="104" rx="10" fill="#6af59a" filter="url(#glow)"/>
</svg>
