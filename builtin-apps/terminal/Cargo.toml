[package]
name = "terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal, a terminal emulator as a Waft app over wasdk-adapter-waft: a shell on a machine its user picks, in a pseudo-terminal of the machines interface, its screen kept by alacritty_terminal and drawn as a grid of cells. `cargo waos run -p terminal`."

[dependencies]
waft-embedder.workspace = true
wasdk-adapter-waft.workspace = true
waft-foundation.workspace = true
# The pointer's events, which the grid hears to select, scroll and report the mouse.
waft-gestures.workspace = true
# The painter a custom-painted widget is given, which `waft-widgets` does not re-export.
waft-rendering.workspace = true
# The keys a key event names, and the clipboard and the text input the view types through.
waft-services.workspace = true
waft-widgets.workspace = true
# Fluent's controls, Waft's WinUI kit, which the page that asks for a machine is drawn with.
waft-winui.workspace = true
# The terminal's screen: the grid of cells, the parser of what a command writes and the scrollback.
vt100 = "0.18.1"
# What goes wrong out of the user's sight: a window WaOS did not make.
tracing.workspace = true
wasdk.workspace = true

[lints]
workspace = true

# What WaOS knows the program by. The id names it for good: every update is published under it.
[package.metadata.waos]
id = "dev.waos.terminal"
name = "Terminal"
icon = "icon.png"
