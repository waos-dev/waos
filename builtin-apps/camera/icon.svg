<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Camera: a lens seen straight on, its glass catching the light from above. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f7f9"/><stop offset="1" stop-color="#cdced4"/></linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55565e"/><stop offset="1" stop-color="#17171b"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfdff"/><stop offset="0.5" stop-color="#9c9da5"/><stop offset="1" stop-color="#d6d7dc"/></linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.32" r="0.8"><stop offset="0" stop-color="#4f7cf0"/><stop offset="0.42" stop-color="#1c2f80"/><stop offset="1" stop-color="#060918"/></radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#030409"/><stop offset="0.65" stop-color="#0c1538"/><stop offset="1" stop-color="#2b44a8"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="20"/><feOffset dy="20"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <circle cx="512" cy="512" r="316" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="292" fill="url(#barrel)"/>
  <circle cx="512" cy="512" r="250" fill="#08080b"/>
  <circle cx="512" cy="512" r="228" fill="url(#glass)"/>
  <circle cx="512" cy="512" r="152" fill="none" stroke="#7d98f5" stroke-opacity="0.3" stroke-width="6"/>
  <circle cx="512" cy="512" r="108" fill="url(#iris)"/>
  <circle cx="512" cy="512" r="44" fill="#020309"/>
  <path d="M330 440 A196 196 0 0 1 620 318 A250 250 0 0 0 330 440 Z" fill="url(#shine)"/>
  <circle cx="606" cy="614" r="18" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="760" cy="264" r="24" fill="#ff9f0a"/>
</svg>
