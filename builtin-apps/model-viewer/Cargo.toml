[package]
name = "model-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Model Viewer, a glTF viewer written without Waft: the scene drawn with wgpu over wasdk-wgpu, physically based, and its panel with egui, fed from a view's events by the app's own glue. `waos run -p model-viewer`."

[dependencies]
wasdk.workspace = true
wasdk-wgpu.workspace = true
wgpu.workspace = true
# The one queue the view's events, the files opened and the system's changes are read from.
futures.workspace = true
# The panel: egui lays it out and tessellates it, and egui-wgpu draws what it tessellated.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
# A model's file: its scenes, meshes, materials, textures and animations, with the images decoded.
# The extensions named are the ones the app draws (unlit, emissive strength) or may pass over (a
# file's lights), so a file that requires one of them is not refused.
gltf = { version = "1.4", features = ["KHR_lights_punctual", "KHR_materials_emissive_strength", "KHR_materials_unlit"] }
# Vectors, matrices and quaternions: the camera, the nodes' transforms and the animations.
glam = { version = "0.30", features = ["bytemuck"] }
# Vertices and uniforms as the bytes a GPU buffer takes.
bytemuck = { version = "1", features = ["derive"] }

[lints]
workspace = true

# What WaOS knows the program by. The id names it for good: every update is published under it.
[package.metadata.waos]
id = "dev.waos.modelviewer"
name = "Model Viewer"
icon = "icon.png"
