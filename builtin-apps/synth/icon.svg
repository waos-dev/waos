<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Synth: a short keyboard, and above it the wave it plays, lit from within. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2c38"/><stop offset="1" stop-color="#0f0e14"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bf5af2"/><stop offset="0.55" stop-color="#ff375f"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.85" stop-color="#e6e6eb"/><stop offset="1" stop-color="#c7c7cf"/></linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a42"/><stop offset="0.8" stop-color="#16161b"/><stop offset="1" stop-color="#0a0a0d"/></linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4952"/><stop offset="1" stop-color="#25242b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="keys"><rect x="208" y="560" width="608" height="232" rx="26"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <path d="M196 392 C 250 392, 270 252, 336 252 C 404 252, 412 470, 482 470 C 552 470, 556 216, 628 216 C 700 216, 710 420, 768 420 C 800 420, 816 380, 828 360" fill="none" stroke="url(#wave)" stroke-width="40" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="184" y="536" width="656" height="276" rx="44" fill="url(#case)" filter="url(#shadow)"/>
  <g clip-path="url(#keys)">
    <rect x="208" y="560" width="608" height="232" fill="url(#white)"/>
    <g stroke="#b9b9c2" stroke-width="4"><path d="M295 560 V792 M382 560 V792 M469 560 V792 M556 560 V792 M643 560 V792 M730 560 V792"/></g>
    <rect x="262" y="560" width="62" height="138" rx="10" fill="url(#black)"/>
    <rect x="352" y="560" width="62" height="138" rx="10" fill="url(#black)"/>
    <rect x="526" y="560" width="62" height="138" rx="10" fill="url(#black)"/>
    <rect x="614" y="560" width="62" height="138" rx="10" fill="url(#black)"/>
    <rect x="702" y="560" width="62" height="138" rx="10" fill="url(#black)"/>
  </g>
</svg>
