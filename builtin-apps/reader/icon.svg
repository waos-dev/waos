<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Reader: the morning's newspaper, rolled and banded as it is delivered. Drawn lying along x, then turned; its rows of print bend with the roll. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb23e"/><stop offset="1" stop-color="#f26b0f"/></linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#f4f0e8"/><stop offset="1" stop-color="#bfb6a6"/></linearGradient>
    <linearGradient id="end" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f3ec"/><stop offset="1" stop-color="#d8d0c2"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eb1ff"/><stop offset="0.5" stop-color="#0a84ff"/><stop offset="1" stop-color="#0050b8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="20"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="body"><path d="M-290 -100 H250 V100 H-290 A44 100 0 0 1 -290 -100 Z"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <g filter="url(#shadow)"><g transform="translate(508 516) rotate(-32) scale(1.15 1.3)">
    <path d="M-290 -100 H250 V100 H-290 A44 100 0 0 1 -290 -100 Z" fill="url(#roll)"/>
    <g clip-path="url(#body)" stroke-linecap="round">
      <path d="M-250 -62 H-60 M40 -62 H210" stroke="#3a3a3c" stroke-opacity="0.75" stroke-width="22"/>
      <path d="M-250 -22 H-70 M40 -22 H200" stroke="#8e8a82" stroke-width="13"/>
      <path d="M-250 12 H-80 M40 12 H210" stroke="#8e8a82" stroke-width="13"/>
      <path d="M-250 44 H-60 M40 44 H170" stroke="#8e8a82" stroke-opacity="0.75" stroke-width="12"/>
      <path d="M-250 72 H-90 M40 72 H200" stroke="#8e8a82" stroke-opacity="0.45" stroke-width="10"/>
    </g>
    <rect x="-36" y="-103" width="44" height="206" rx="6" fill="url(#band)"/>
    <ellipse cx="250" cy="0" rx="44" ry="100" fill="url(#end)"/>
    <g fill="none" stroke="#a89f8f" stroke-width="5">
      <path d="M250 -100 A44 100 0 0 1 250 100"/>
      <path d="M252 -72 A32 74 0 0 1 252 76 A28 64 0 0 1 256 -50 A20 46 0 0 1 256 46 A14 30 0 0 1 258 -22"/>
    </g>
  </g></g>
</svg>
