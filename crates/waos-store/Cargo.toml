[package]
name = "waos-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The package sources the user added and their downloads, each app's own folders and its activity, in a directory the app gives it."

[dependencies]
waos-package.workspace = true
# Whether each app's activity is recorded, which its settings say.
waos-permissions.workspace = true
# Reading a source's index and downloading its packages, through the system's proxy, an HTTP
# proxy or a SOCKS one; and the URL a source is.
reqwest = { workspace = true, features = ["system-proxy", "socks"] }
url.workspace = true
# A download's SHA-256, checked against its listing, and said in hex when it differs.
sha2.workspace = true
hex.workspace = true
# The list of sources, kept as TOML; the programs' audit summaries, kept as postcard.
serde.workspace = true
postcard.workspace = true
toml.workspace = true
# A file written whole.
tempfile.workspace = true
# A download's bytes as a stream; a change of the settings, which the activity follows, waited
# for.
tokio.workspace = true
futures.workspace = true
# An app's own folders, and what it did, as the engine names them.
waos-capabilities.workspace = true
# What could not be read, for whoever subscribes.
tracing.workspace = true

[dev-dependencies]
# A local HTTP server, which the tests read sources from.
tokio = { workspace = true, features = ["net", "io-util"] }
# What installs the packages the tests download, and removes the apps whose settings they keep.
waos-package-manager.workspace = true
anyhow.workspace = true

[lints]
workspace = true
