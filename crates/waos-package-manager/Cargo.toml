[package]
name = "waos-package-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The apps installed on a WaOS device, and every change to them: installs in flight, updates, removals, and the code compiled for each."

[dependencies]
waos-package.workspace = true
# The compiler's errors, which the engine says as anyhow's.
anyhow.workspace = true
# What is installed and the installs in flight, watched; each app's lock; a session's work on the
# runtime it was asked on, and its blocking steps off it.
tokio.workspace = true
# A package's bytes, as a stream; what stops an app, as a future.
futures.workspace = true
# A development build's SHA-256, which its install keeps.
sha2.workspace = true
# What a package is received into, and unpacked into, before it is installed.
tempfile.workspace = true
# What could not be read or removed, for whoever subscribes.
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
