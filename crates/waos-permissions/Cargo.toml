[package]
name = "waos-permissions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "What the user lets each WaOS app use, and the questions being asked of the user now."

[dependencies]
waos-package.workspace = true
# What the user lets an app use, which Permissions answers to the engine as `ProgramGrants`.
waos-capabilities.workspace = true
# The settings kept as TOML files, each written whole.
serde.workspace = true
toml.workspace = true
tempfile.workspace = true
# What tells an app's grants that the settings changed; the questions asked now, watched; the
# package manager's removals, heard.
tokio.workspace = true
# A question asked once, its answer shared by every wait.
futures.workspace = true
# What could not be read or kept, for whoever subscribes.
tracing.workspace = true

[lints]
workspace = true
