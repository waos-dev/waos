[package]
name = "waos-package"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
description = "The .wapk format: a program's manifest, component and icon in one zip, signed with its publisher's key; and the index.json a package source lists its programs in."
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
zip.workspace = true
toml.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
getrandom.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# The systems this crate's tests run on in CI (`.github/platform-test-packages.sh`): macOS runs every
# crate's, and Linux and Windows those of the crates that name them and whose code depends on the system.
[package.metadata.waos]
systems = ["macos", "linux", "windows"]
