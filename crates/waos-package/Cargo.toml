[package]
name = "waos-package"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
description = "The .wapk format: a program's manifest, component and icon in one zip, signed with its publisher's key; and the index.json a package source lists its programs in."
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
zip.workspace = true
toml.workspace = true
semver.workspace = true
serde.workspace = true
# A listing's release date, as `2026-11-23`.
jiff = { workspace = true, features = ["serde"] }
serde_json.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
getrandom.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
