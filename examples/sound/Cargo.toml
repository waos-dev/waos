[package]
name = "sound"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that makes sound: a graph of every kind of node, a sound file decoded, samples streamed and heard back, an output picked and moved onto, and the microphone heard once allowed. `cargo build -p sound --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.sound"
