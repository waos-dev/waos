[package]
name = "fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that reads the fonts it was given: the system font, its character map, and one glyph's coverage and outline. `cargo build -p fonts --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true
# The character map, read from the table the engine serves.
read-fonts.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.fonts"
