[package]
name = "two-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "An Waft app with two windows, each spinning an activity indicator, over wasdk-adapter-waft. `cargo build -p two-windows --target wasm32-wasip2`."

[dependencies]
waft-cupertino.workspace = true
waft-embedder.workspace = true
wasdk-adapter-waft.workspace = true
waft-foundation.workspace = true
waft-services.workspace = true
waft-widgets.workspace = true
wasdk.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.twowindows"
