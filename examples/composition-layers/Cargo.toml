[package]
name = "composition-layers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that places composition layers beneath its drawing: two in its first frame, one in its second. `cargo build -p composition-layers --target wasm32-wasip2`."

[dependencies]
wasdk.workspace = true
wasdk-wgpu.workspace = true
wgpu.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.compositionlayers"
