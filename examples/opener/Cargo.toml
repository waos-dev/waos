[package]
name = "opener"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that opens links and files in the apps the system picks, and hears what its user opens with it: what a reader learns the opener interface and the lifecycle's open requests from. `cargo build -p opener --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.opener"
