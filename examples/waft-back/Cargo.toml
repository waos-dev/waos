[package]
name = "waft-back"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A Waft app with pages to go back through, over waft-embedder-wasdk, which hears the user's Back while its navigator can pop with no code of its own. `cargo build -p waft-back --target wasm32-wasip2`."

[dependencies]
waft-cupertino.workspace = true
waft-embedder.workspace = true
waft-embedder-wasdk.workspace = true
waft-foundation.workspace = true
waft-rendering.workspace = true
waft-widgets.workspace = true
wasdk.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.waftback"
