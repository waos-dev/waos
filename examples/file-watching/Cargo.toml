[package]
name = "file-watching"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that watches a folder in its own /tmp: a file made, written, renamed and removed, a folder beneath watched recursively and not, and what cannot be watched. `cargo build -p file-watching --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.filewatching"
