[package]
name = "camera"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "An Waft app that shows the first camera's preview, prints its formats, the format it runs in and each change of its state, and takes a photo at a button's press, over wasdk-adapter-waft. `cargo build -p camera --target wasm32-wasip2`."

[dependencies]
waft-cupertino.workspace = true
waft-embedder.workspace = true
wasdk-adapter-waft.workspace = true
waft-foundation.workspace = true
waft-widgets.workspace = true
wasdk.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.camera"
