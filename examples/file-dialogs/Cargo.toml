[package]
name = "file-dialogs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that picks files and a folder in the platform's dialogs and saves into a picked file, safely through its own folder: what a reader learns the file dialogs interface from. `cargo build -p file-dialogs --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true

[lints]
workspace = true

# The id `waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.filedialogs"
