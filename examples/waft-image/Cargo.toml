[package]
name = "waft-image"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A Waft app that draws a PNG from its own bytes with Waft's `Image::memory`, decoded through the system's image codecs, over wasdk-adapter-waft. `cargo build -p waft-image --target wasm32-wasip3`."

[dependencies]
waft-embedder.workspace = true
wasdk-adapter-waft.workspace = true
waft-widgets.workspace = true
wasdk.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.waftimage"
