[package]
name = "video-decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that decodes an H.264 stream with the system's decoder, reading the stream itself, and prints each frame as it comes out, in the order the pictures are shown, with the first one's samples as its GPU reads them. `cargo build -p video-decoding --target wasm32-wasip3`."

[dependencies]
# Handing chunks over and reading frames at once, and waiting for a buffer's mapping.
futures.workspace = true
wasdk.workspace = true
wasdk-wgpu.workspace = true
wgpu.workspace = true

[lints]
workspace = true

# The id `waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.video-decoding"
