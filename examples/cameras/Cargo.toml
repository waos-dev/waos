[package]
name = "cameras"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that lists the system's cameras, opens the first once its user allows it, starts it in its last format with a preview layer, a frame reader and photos, takes a photo and says each state the session changes to. `cargo build -p cameras --target wasm32-wasip2`."

[dependencies]
wasdk.workspace = true

[lints]
