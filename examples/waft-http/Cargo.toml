[package]
name = "waft-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A Waft app that sends HTTP through wasdk-adapter-waft: response trailers, request trailers, and a 307 with a body held in memory and with a body that streams. `cargo build -p waft-http --target wasm32-wasip3`."

[dependencies]
http.workspace = true
waft.workspace = true
waft-embedder.workspace = true
waft-widgets.workspace = true
wasdk.workspace = true
wasdk-adapter-waft.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.wafthttp"
