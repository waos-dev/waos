[package]
name = "egui-widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The smallest program whose UI is egui: a button that counts its clicks and a field that takes text, over wasdk-adapter-egui and drawn by egui-wgpu. `cargo build -p egui-widgets --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true
wasdk-wgpu.workspace = true
wasdk-adapter-egui.workspace = true
wgpu.workspace = true
egui = { workspace = true, features = ["default_fonts"] }
egui-wgpu = { workspace = true }

[lints]
workspace = true

# The id `waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.eguiwidgets"
