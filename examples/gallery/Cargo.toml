[package]
name = "gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Waft's Cupertino gallery as a program: the crate Waft's own binary runs, over wasdk-adapter-waft. `cargo build -p gallery --target wasm32-wasip3`."

[dependencies]
cupertino-gallery.workspace = true
wasdk-adapter-waft.workspace = true
wasdk.workspace = true

[lints]
workspace = true

# What WaOS knows the program by: the id `cargo waos run` runs it as, with that program's
# settings and folders, and the name and icon `cargo waos package` writes into its package.
[package.metadata.waos]
id = "dev.waos.examples.gallery"
name = "Gallery"
icon = "icon.png"
