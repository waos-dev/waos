[package]
name = "gpu-in-block-on"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that opens a GPU device inside `wasdk::block_on`, as a winit app does inside its event loop, submits once and returns. `cargo build -p gpu-in-block-on --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true
wasdk-wgpu.workspace = true
wgpu.workspace = true

[lints]
workspace = true

# The id `waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.gpu-in-block-on"
