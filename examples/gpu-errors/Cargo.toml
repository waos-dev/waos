[package]
name = "gpu-errors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that says where wgpu's errors reach it, as wgpu's own backends route them: to the error scope open as each is made, or else to the device's uncaptured-error handler. `cargo build -p gpu-errors --target wasm32-wasip3`."

[dependencies]
# The uncaptured-error handler's errors, awaited as the handler hears them.
futures.workspace = true
wasdk.workspace = true
wasdk-wgpu.workspace = true
wgpu.workspace = true

[lints]
workspace = true

# The id `waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.gpu-errors"
