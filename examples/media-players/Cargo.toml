[package]
name = "media-players"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that plays the sources listed in its /data/sources through the system's players, each on a composition layer of its own, and says each player's state. `cargo build -p media-players --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true

[lints]
workspace = true

# The id `cargo waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.mediaplayers"
