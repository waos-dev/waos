[package]
name = "inspect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program with the inspector role: it says the programs on this device, then what the first running one writes. `cargo build -p inspect --target wasm32-wasip3`."

[dependencies]
wasdk = { workspace = true, features = ["inspector"] }

[lints]
workspace = true

# The id `waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.inspect"
