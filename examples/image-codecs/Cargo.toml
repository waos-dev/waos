[package]
name = "image-codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that opens the images listed in its /data/sources through the system's image codecs and says what each says of itself, decodes it into its own memory and, where the system can, into a hardware buffer it reads back, and encodes each again. `cargo build -p image-codecs --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true

[lints]
workspace = true

# The id `waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.imagecodecs"
