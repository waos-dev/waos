[package]
name = "media-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A program that reads the sources listed in its /data/sources through the system's reading of media, without playing them, and says each one's length, tracks, title and the size of a picture ten percent in. `cargo build -p media-assets --target wasm32-wasip3`."

[dependencies]
wasdk.workspace = true

[lints]
workspace = true

# The id `waos run` runs this program as, with that program's settings and folders.
[package.metadata.waos]
id = "dev.waos.examples.mediaassets"
