[package]
name = "waos-local-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "This computer's sound devices as a capability of WaOS's engine."

[dependencies]
waos-capabilities.workspace = true
# The system's audio, which web-audio-api reaches through cpal: Core Audio on Apple's systems,
# WASAPI on Windows, ALSA on Linux, AAudio on Android.
web-audio-api = { workspace = true, features = ["cpal"] }

[lints]
workspace = true
