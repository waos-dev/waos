[package]
name = "wasdk-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
description = "#[wasdk::main], the entry of a WaOS program written with wasdk, which wasdk re-exports."
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[lints]
workspace = true

# The systems this crate's tests run on in CI (`.github/platform-test-packages.sh`): macOS runs every
# crate's, and Linux and Windows those of the crates that name them and whose code depends on the system.
[package.metadata.waos]
systems = ["macos", "linux", "windows"]
