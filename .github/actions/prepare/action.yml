# What every job that builds the workspace does first, after its checkout (with `fetch-depth: 0`):
# each file dated by its last commit, Rust's cache, and (when opted in) the test programs main last
# built.
name: Prepare a build
description: Dates the checkout's files by their commits, restores Rust's cache, and optionally restores the test programs.
inputs:
  test-programs:
    description: Whether to restore target/test-programs (needed by jobs that build or run waos-test-programs).
    required: false
    default: "false"
outputs:
  test-programs-key:
    description: The key target/test-programs is cached under, for a job on main to save it with.
    value: ${{ steps.test-programs-key.outputs.key }}
runs:
  using: composite
  steps:
    # Each file dated by its last commit, not the checkout: cargo rebuilds what is newer than what
    # it built, so the test programs restored below are rebuilt only where a commit changed them,
    # and their compiled code stays valid.
    - uses: chetan/git-restore-mtime-action@v2
    # Saved even when the job fails: what it compiled is good whatever a test found, and a job
    # that failed on main would otherwise leave its cache behind main's code.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    # The programs the engine's and the app's tests run, built for wasm32-wasip3 by
    # `waos-test-programs` into target/test-programs with their compiled code: minutes to make,
    # kept apart from rust-cache, which drops what the workspace's own build scripts make. Named by
    # what they are built with (the dependencies' versions and the toolchain), then by what they
    # are built from (`crates/waos/tests/programs/build.rs`). A change to what they are built from
    # starts from main's last build and rebuilds what changed; a change to what they are built
    # with starts from nothing, as rust-cache does, since every build before it would stay in the
    # folder beside the new one, and the cache would only grow. A job that runs tests saves it on
    # main, under the key answered here.
    - name: The key of the test programs
      id: test-programs-key
      if: inputs.test-programs == 'true'
      shell: bash
      env:
        BUILT_WITH: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        BUILT_FROM: ${{ hashFiles('builtin-apps/**', 'examples/**', 'sdk/**', 'wit/**', 'crates/waos/tests/programs/**') }}
      run: |
        echo "built-with=test-programs-$RUNNER_OS-$BUILT_WITH-" >> "$GITHUB_OUTPUT"
        echo "key=test-programs-$RUNNER_OS-$BUILT_WITH-$BUILT_FROM" >> "$GITHUB_OUTPUT"
    - name: The test programs, as main last built them
      if: inputs.test-programs == 'true'
      uses: actions/cache/restore@v4
      with:
        path: target/test-programs
        key: ${{ steps.test-programs-key.outputs.key }}
        restore-keys: ${{ steps.test-programs-key.outputs.built-with }}
