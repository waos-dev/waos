# What every job that builds the workspace does first, after its checkout: Rust's cache, which
# keeps what the workspace depends on and nothing of its own crates. The test programs
# (`waos-test-programs`) are built in each job: measured on 2026-11-28, building them took no
# longer than restoring a cache of them.
name: Prepare a build
description: Restores Rust's cache.
runs:
  using: composite
  steps:
    # Saved even when the job fails: what it compiled is good whatever a test found, and a job
    # that failed on main would otherwise leave its cache behind main's code.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
