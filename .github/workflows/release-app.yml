# The WaOS app of a release, on the same tag as the crates (`release.yml`), built in release from
# the tag and the Waft release it names, packaged by Waft's newest command, and attached to the
# tag's GitHub release, where waos.app's Download points, each named
# `WaOS-<version>-<system>-<arch>` (the name is the file's; `gh release upload`'s `#` only labels it):
# - macOS: signed with the publisher's Developer ID, notarized and stapled, as a disk image; built ad
#   hoc, as the job says, until the Apple secrets below are set. iOS is built for the simulator on
#   the same machine, after the image, as a check that it still builds.
# - Linux: the unified `waos` binary for x86_64, built against glibc 2.35, packaged as `WaOS-<version>-linux-x86_64.tar.gz`.
# - Windows: an x64 NSIS installer, `WaOS-<version>-windows-x64-setup.exe`, installing for the user
#   alone, which waos.app's install.ps1 runs silently; unsigned for now.
# - Android: an `.apk` for 64-bit ARM, on Linux, signed with the release key in the secrets below,
#   which `cargo waft build apk` takes from WAFT_ANDROID_KEYSTORE and its variables.
#
# Secrets: APPLE_CERTIFICATE (the Developer ID Application certificate and its key, a .p12, in
# base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY (its name, "Developer ID Application:
# …"), and for notarization either an Apple ID (APPLE_ID, APPLE_PASSWORD, an app-specific one, and
# APPLE_TEAM_ID) or an App Store Connect API key (APPLE_API_KEY, its id; APPLE_API_ISSUER;
# APPLE_API_KEY_P8, the .p8's text), whichever is set, as `cargo waft build` reads them;
# ANDROID_KEYSTORE_BASE64 (the release keystore, its alias `waos`, in base64) and
# ANDROID_KEYSTORE_PASSWORD.
#
# Run by hand with a tag to make that release's image again, from the tag's sources with this
# workflow: when the secrets came after the tag, or notarization failed.
name: Release the app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose app image to make again, e.g. v0.3.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Waft's command, its newest release
        run: cargo install --locked waft-cli
      - name: The signing identity, in a keychain of the job's own
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::no Apple signing secrets: the disk image is signed ad hoc and not notarized"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A Developer ID certificate is a valid identity only with Apple's intermediate beside it,
          # which a runner may not have.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          # Every identity the keychain holds, valid or not and why, so a mismatch says itself.
          security find-identity -p codesigning "$keychain"
          if [ -n "$APPLE_API_KEY_P8" ]; then printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"; fi
          echo "identity=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_OUTPUT"
      - name: WaOS.app, as a disk image
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_P8 && format('{0}/notary.p8', runner.temp) || '' }}
        # `cargo waft build` prints the path of what it made, the one file to attach.
        id: dmg
        run: |
          set -o pipefail
          built=$(cargo waft build dmg -p waos-app | tail -1)
          echo "path=$built" >> "$GITHUB_OUTPUT"
      - name: Attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          image: ${{ steps.dmg.outputs.path }}
        run: |
          test -f "$image" || { echo "no disk image was made"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "WaOS ${TAG#v}" --notes ""
          named="$RUNNER_TEMP/WaOS-${TAG#v}-macos-arm64.dmg"
          cp "$image" "$named"
          gh release upload "$TAG" "$named" --clobber
      - name: iOS, for the simulator, as a check that it builds
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo waft build ios --simulator -p waos-app

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Waft's command, its newest release, and Android's target
        run: |
          cargo install --locked waft-cli
          rustup target add aarch64-linux-android
      # The runner has the SDK, the NDK and Java, in ANDROID_HOME, ANDROID_NDK_HOME and JAVA_HOME.
      - name: The release key, in the job's own folder
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/release-password"
      - name: WaOS, as an apk
        env:
          WAFT_ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          WAFT_ANDROID_KEY_ALIAS: waos
          WAFT_ANDROID_STORE_PASSWORD_FILE: ${{ runner.temp }}/release-password
        # `cargo waft build` prints the path of what it made: the signed .apk, beside the unsigned
        # ones of its stage, which a search for any .apk can find first.
        id: apk
        run: |
          set -o pipefail
          built=$(cargo waft build apk -p waos-app | tail -1)
          echo "path=$built" >> "$GITHUB_OUTPUT"
      - name: Signed with the release key
        env:
          apk: ${{ steps.apk.outputs.path }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certificates"
          grep -v "^WARNING" "$RUNNER_TEMP/certificates"
          # The debug key's certificate is Android's own: a release signed with it is no release.
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certificates"; then
            echo "the .apk is signed with the debug key"
            exit 1
          fi
      - name: Attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          apk: ${{ steps.apk.outputs.path }}
        run: |
          test -f "$apk" || { echo "no apk was made"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "WaOS ${TAG#v}" --notes ""
          named="$RUNNER_TEMP/WaOS-${TAG#v}-android-arm64.apk"
          cp "$apk" "$named"
          gh release upload "$TAG" "$named" --clobber

  # Built on the oldest Ubuntu GitHub runs, whose glibc (2.35) is the newest the binary may ask
  # for: a binary built on a newer one asks for that one's, and stops at its start on Debian 12,
  # Ubuntu 22.04 and 24.04 and most clouds' images.
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The system packages the build's probes ask for
        run: |
          apt_net="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5"
          sudo apt-get $apt_net update
          sudo apt-get $apt_net install -y --no-install-recommends \
            pkg-config libasound2-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev
      - name: WaOS, as a Linux x86_64 tarball
        run: |
          cargo build --release -p waos-app --bin waos
          tar -C target/release -czf "$RUNNER_TEMP/WaOS-${TAG#v}-linux-x86_64.tar.gz" waos
      - name: The binary asks for no glibc newer than 2.35
        run: |
          newest=$(objdump -T target/release/waos | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "newest glibc asked for: $newest"
          test "$(printf '%s\n' "$newest" 2.35 | sort -V | tail -1)" = 2.35
      - name: Attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/WaOS-${TAG#v}-linux-x86_64.tar.gz"
          test -f "$archive" || { echo "no Linux tarball was made"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "WaOS ${TAG#v}" --notes ""
          gh release upload "$TAG" "$archive" --clobber

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Waft's command, its newest release
        run: cargo install --locked waft-cli
      - name: WaOS, as an installer
        # `cargo waft build` prints the path of what it made, the one file to attach.
        id: setup
        shell: bash
        run: |
          set -o pipefail
          built=$(cargo waft build nsis -p waos-app | tail -1)
          echo "path=$built" >> "$GITHUB_OUTPUT"
      - name: Attached to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          setup: ${{ steps.setup.outputs.path }}
        run: |
          setup=$(cygpath -u "$setup")
          test -f "$setup" || { echo "no installer was made"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "WaOS ${TAG#v}" --notes ""
          named="$RUNNER_TEMP/WaOS-${TAG#v}-windows-x64-setup.exe"
          cp "$setup" "$named"
          gh release upload "$TAG" "$named" --clobber

  # The files just attached, copied to download.waos.app.
  mirror:
    needs: [macos, android, linux, windows]
    uses: ./.github/workflows/mirror-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
