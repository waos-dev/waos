# Every change: the WIT keeps its versions honest, the workspace lints, and its tests pass (the
# design's decision 67). Waft comes from crates.io, as the README's Contribute section says.
#
# The jobs run side by side, each as short as the slowest piece it holds: on macOS the engine and
# the command, the app, and the rest of the workspace; on Linux and Windows clippy apart from the
# tests. Each prepares with `.github/actions/prepare` (files dated by their commits, Rust's cache,
# the test programs); main's runs save the caches, a pull request's only read them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes the run before it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debug-segv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/linux-packages
      - uses: ./.github/actions/prepare
      - run: sudo apt-get install -y gdb
      - name: Crash under gdb, with the system's symbols
        env:
          DEBUGINFOD_URLS: https://debuginfod.ubuntu.com
        run: |
          dpkg -l libvulkan1 mesa-vulkan-drivers | tail -2
          bin=$(cargo test -p waos --lib --no-run --message-format=json | jq -r 'select(.executable != null and .target.kind == ["lib"]) | .executable' | head -1)
          test -x "$bin"
          for i in $(seq 1 40); do
            echo "== whole lib, run $i"
            out=$(gdb -q -batch -ex "set debuginfod enabled on" -ex run -ex "bt 12" -ex "info threads" --args "$bin" -q 2>&1)
            if echo "$out" | grep -q SIGSEGV; then
              echo "$out" | sed -n "/received signal/,\$p" | grep -v "^Downloading" | head -80
              break
            fi
          done
