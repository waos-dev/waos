# Copies a release's files to Cloudflare R2 (bucket `waos-releases`, served at download.waos.app as
# `<tag>/<file>`), where waos.app's /download/<platform> sends people: GitHub serves release files
# slowly in places, R2 quickly and with no charge for the download. Each release workflow calls it
# with its tag once its files are attached, whether the tag's push or a run by hand started it;
# and it runs by hand for a tag (`gh workflow run mirror-release.yml -f tag=v0.4.0`).
#
# Secrets: CLOUDFLARE_API_TOKEN (R2 write) and CLOUDFLARE_ACCOUNT_ID.
name: Mirror a release to R2

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag whose files to copy, e.g. v0.4.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose files to copy, e.g. v0.4.0
        required: true

concurrency:
  group: mirror-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: The release's files, from GitHub
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files
      - name: Each file to R2, as <tag>/<file>
        run: |
          for file in files/*; do
            npx --yes wrangler@4 r2 object put "waos-releases/$TAG/$(basename "$file")" --file "$file" --remote
          done
